model:
  path: yolov8m-seg.pt
  weights: best.pt  # which weights to use for eval and inference (best or last)

mlflow:
  project: "001-IS-MVTec"  # mlflow experiment name

dataset:
  path: ./data/dataset/dataset.yaml  # path to dataset YAML

train:
  epochs: 100  # number of training epochs
  imgsz: 640  # training image size
  batch: 2  # batch size
  device: 0  # device to run on, i.e. device=0 or device=0,1,2,3 or device=cpu
